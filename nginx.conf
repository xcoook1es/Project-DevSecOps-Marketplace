server {
    listen 80;

    # ── Header Keamanan untuk HTTP ──────────────────────────────────
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;
    add_header X-Frame-Options "DENY" always;

    # ── Nginx Prometheus Exporter endpoint ───────────────────────
    # Hanya bisa diakses dari dalam Docker network (monitoring)
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 172.16.0.0/12;   # Docker internal networks
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
    }

    # Redirect semua HTTP selain /nginx_status ke HTTPS
    location / {
        return 301 https://$host:3443$request_uri;
    }
}

server {
    listen 443 ssl;
    root  /usr/share/nginx/html;
    index login.html;
    client_max_body_size 10m;

    # SSL Certificate
    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Header Keamanan (Termasuk CSP) ──────────────────────────────
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https: http:; connect-src 'self'; frame-ancestors 'none';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy semua request /api/ ke backend Node.js
    location /api/ {
        proxy_pass         http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Static files
    location / {
        try_files $uri $uri/ =404;
    }
}
