name: DevSecOps CI/CD Pipeline

# Pipeline akan berjalan otomatis setiap ada 'push' atau 'pull_request' ke branch 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permission untuk push image ke GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:

  # ══════════════════════════════════════════════════════════════
  # SAST — Static Application Security Testing (Semgrep)
  # ══════════════════════════════════════════════════════════════
  sast-semgrep:
    name: "🔍 SAST — Semgrep Scan"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Run Semgrep Full Scan
      run: semgrep scan --config auto --json --output semgrep-results.json . || true

    - name: Display Semgrep Results Summary
      run: semgrep scan --config auto --text .  || true

    - name: Upload Semgrep Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: semgrep-report
        path: semgrep-results.json
        retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # SAST — Static Application Security Testing (njsscan)
  # ══════════════════════════════════════════════════════════════
  sast-njsscan:
    name: "🔍 SAST — njsscan (Node.js)"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install njsscan
      run: pip install njsscan

    - name: Run njsscan on Backend
      run: njsscan --json --output njsscan-backend.json ./backend || true

    - name: Run njsscan on Frontend
      run: njsscan --json --output njsscan-frontend.json ./src || true

    - name: Display njsscan Results
      run: |
        echo "══════════════════════════════════════"
        echo "📋 njsscan Results — Backend"
        echo "══════════════════════════════════════"
        njsscan ./backend || true
        echo ""
        echo "══════════════════════════════════════"
        echo "📋 njsscan Results — Frontend"
        echo "══════════════════════════════════════"
        njsscan ./src || true

    - name: Upload njsscan Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: njsscan-report
        path: |
          njsscan-backend.json
          njsscan-frontend.json
        retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # CI/CD — Build, Security Audit & DAST (OWASP ZAP)
  # ══════════════════════════════════════════════════════════════
  build-security-and-dast:
    name: "🏗️ Build, Security Check & DAST"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Dependency Security Audit
      run: npm audit --audit-level=high || true

    - name: Start Application Stack (Docker Compose)
      run: docker compose up -d --build

    - name: Wait for Application to be Ready
      run: |
        echo "⏳ Menunggu aplikasi siap..."
        for i in $(seq 1 30); do
          if curl -s http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ Aplikasi sudah siap! (percobaan ke-$i)"
            break
          fi
          echo "   Percobaan ke-$i — belum siap, menunggu 5 detik..."
          sleep 5
        done

    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.14.0
      with:
        target: 'http://localhost:3000'
        rules_file_name: '.zap/rules.tsv'
        allow_issue_writing: false
        cmd_options: '-a'

    - name: Upload ZAP Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: zap-report
        path: report_html.html
        retention-days: 30

    - name: Stop Application Stack
      if: always()
      run: docker compose down -v

  # ══════════════════════════════════════════════════════════════
  # CD — Deploy Docker Images ke GitHub Container Registry
  # ══════════════════════════════════════════════════════════════
  deploy:
    name: "Deploy to GHCR"
    runs-on: ubuntu-latest
    needs: [build-security-and-dast, sast-semgrep, sast-njsscan]
    if: github.event_name == 'push'       

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase repository name
      run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

    - name: Build and Push Frontend Image
      run: |
        docker build -t ghcr.io/${{ env.REPO_LC }}/web:latest \
                      -t ghcr.io/${{ env.REPO_LC }}/web:${{ github.sha }} .
        docker push ghcr.io/${{ env.REPO_LC }}/web:latest
        docker push ghcr.io/${{ env.REPO_LC }}/web:${{ github.sha }}

    - name: Build and Push Backend Image
      run: |
        docker build -t ghcr.io/${{ env.REPO_LC }}/api:latest \
                      -t ghcr.io/${{ env.REPO_LC }}/api:${{ github.sha }} ./backend
        docker push ghcr.io/${{ env.REPO_LC }}/api:latest
        docker push ghcr.io/${{ env.REPO_LC }}/api:${{ github.sha }}

    - name: Deployment Summary
      run: |
        echo "✅ Deployment berhasil!"
        echo ""
        echo "📦 Images yang di-deploy:"
        echo "   Frontend: ghcr.io/${{ env.REPO_LC }}/web:latest"
        echo "   Backend:  ghcr.io/${{ env.REPO_LC }}/api:latest"
        echo ""
        echo "🏷️  Tag commit: ${{ github.sha }}"