name: DevSecOps CI/CD Pipeline

# Pipeline akan berjalan otomatis setiap ada 'push' atau 'pull_request' ke branch 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-security-check:
    runs-on: ubuntu-latest

    steps:
    # Langkah 1: Mengambil source code dari repositori GitHub
    - name: Checkout Source Code
      uses: actions/checkout@v3

    # Langkah 2: Menyiapkan environment Node.js
    - name: Setup Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    # Langkah 3: Menginstal dependensi aplikasi secara bersih
    - name: Install Dependencies
      run: npm ci

    # Langkah 4: Pemindaian Keamanan Dasar (Sangat bagus untuk justifikasi DevSecOps)
    - name: Run Dependency Security Audit
      run: npm audit --audit-level=high

    # Langkah 5: Membangun Image Docker untuk aplikasi Node.js
    - name: Build Web Container Image
      run: docker build -t devsecops-node-app:${{ github.sha }} .

    # Langkah 6: Menguji Docker Compose (Memastikan Node & DB bisa berjalan bersama)
    - name: Test Docker Compose Build
      run: docker-compose up -d --build