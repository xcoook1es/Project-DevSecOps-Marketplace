name: DevSecOps CI/CD Pipeline

# Pipeline akan berjalan otomatis setiap ada 'push' atau 'pull_request' ke branch 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permission untuk push image ke GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:

  # ══════════════════════════════════════════════════════════════
  # CI — Build & Security Check
  # ══════════════════════════════════════════════════════════════
  build-and-security-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Dependency Security Audit
      run: npm audit --audit-level=high || true

    - name: Build Web Container Image
      run: docker build -t devsecops-node-app:${{ github.sha }} .

    - name: Test Docker Compose Build
      run: docker compose up -d --build

  # ══════════════════════════════════════════════════════════════
  # CD — Deploy Docker Images ke GitHub Container Registry
  # ══════════════════════════════════════════════════════════════
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-security-check       
    if: github.event_name == 'push'       

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase repository name
      run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

    - name: Build and Push Frontend Image
      run: |
        docker build -t ghcr.io/${{ env.REPO_LC }}/web:latest \
                      -t ghcr.io/${{ env.REPO_LC }}/web:${{ github.sha }} .
        docker push ghcr.io/${{ env.REPO_LC }}/web:latest
        docker push ghcr.io/${{ env.REPO_LC }}/web:${{ github.sha }}

    - name: Build and Push Backend Image
      run: |
        docker build -t ghcr.io/${{ env.REPO_LC }}/api:latest \
                      -t ghcr.io/${{ env.REPO_LC }}/api:${{ github.sha }} ./backend
        docker push ghcr.io/${{ env.REPO_LC }}/api:latest
        docker push ghcr.io/${{ env.REPO_LC }}/api:${{ github.sha }}

    - name: Deployment Summary
      run: |
        echo "✅ Deployment berhasil!"
        echo ""
        echo "📦 Images yang di-deploy:"
        echo "   Frontend: ghcr.io/${{ env.REPO_LC }}/web:latest"
        echo "   Backend:  ghcr.io/${{ env.REPO_LC }}/api:latest"
        echo ""
        echo "🏷️  Tag commit: ${{ github.sha }}"